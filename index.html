<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMMMSU Campus Notices</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <header class="header">
        <img src="LOGO.png" class="logo" alt="DMMMSU Logo">
        <h1>Don Mariano Marcos Memorial State University</h1>
    </header>

    <nav class="navbar">
        <a href="index.html">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT US</a>
    </nav>

    <main class="content">
        <h2>CAMPUS NOTICE</h2>

        <div class="images">
            <img src="frog.png" alt="Image 1">
            <img src="comsci.webp" alt="Image 2">
            <img src="yey.webp" alt="Image 3">
        </div>
    </main>

    <aside class="right">
        <form>
            <label for="title">Title</label>
            <input type="text" id="title" name="title">

            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Post Notice</button>
        </form>
    </aside>

    <footer class="footer">
        <h3>COLLEGE OF COMPUTER SCIENCE</h3>
    </footer>

</div>

</body>
</html>
